name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches VERSION in batowatch.py
        run: |
          v="$(sed -n 's/^VERSION = "\(.*\)".*/\1/p' batowatch.py)"
          [ "v${v}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but VERSION is ${v}"; exit 1; }
      - name: Tests
        run: |
          python3 tests/test_fake_trees.py
          python3 tests/test_settings_auth.py
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for ${v}"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "BatoWatch ${GITHUB_REF_NAME#v}" --notes-file notes.md

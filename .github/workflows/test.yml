name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"     # Batocera's Python
      - name: Lint
        run: |
          pip install pyflakes
          pyflakes *.py tv/*.py tests/*.py art/*.py
          shellcheck -s bash batowatch-service.sh
      - name: Tests
        run: |
          python3 tests/test_fake_trees.py
          python3 tests/test_settings_auth.py
  flows:
    # The bw-flows helper: static build on both architectures, then a short
    # run (it needs root for its packet socket) to check the ring buffer works.
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: flows/build.sh
      - name: Run
        run: sudo "flows/bw-flows-$(uname -m)" -t 2

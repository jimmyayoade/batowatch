# BatoWatch settings: one KEY=value per line.
#
# Change them here or on the dashboard's Settings page; both edit this file.
# Most changes apply within 10 seconds. Ones marked (restart) need BatoWatch
# restarted: the dashboard offers a button, or run
#   batocera-services restart batowatch
#
# The dashboard lists every device on your network that talks to this box.
# Don't expose its port to the internet. A value with spaces needs quotes:
#   LOGIN='me:my password'


# ===== Dashboard ===================================================

# Dashboard login: 'batocera' (user root, your Batocera password),
# 'user:password' for your own, or 'none'
LOGIN=batocera

# self = BatoWatch's own certificate (browser warns once); auto = also a
# Tailscale certificate for the tailnet name (publishes that name in public
# certificate logs); tailscale = only that; off = plain http (restart)
HTTPS=self

# Dashboard port; 0 turns the dashboard off (restart)
WEB_PORT=8686

# Address the dashboard listens on: 0.0.0.0 = every network; your Tailscale IP
# (100.x.y.z) keeps it off the LAN (restart)
WEB_BIND=0.0.0.0

# Tab the dashboard opens on
DEFAULT_TAB=hardware

# C, F, or TZ (picked from Batocera's time zone)
TEMP_UNIT=TZ


# ===== Parts =======================================================

# Watch who connects to this box (the Network tab) (restart)
NETWORK=on

# Watch the hardware, with history (the Hardware tab) (restart)
HARDWARE=on


# ===== Banners =====================================================

# How banners are shown: overlay (drawn over games), es (EmulationStation
# popup), both, or print (log only)
NOTIFY=overlay

# Seconds a connect banner stays on screen
OVERLAY_DURATION=5

# Seconds after a stream ends before the same device gets a connect banner
# again (0 = always)
CONNECT_REPEAT=10

# outline = see-through outlined text; solid = dark box
OVERLAY_STYLE=outline

# Banner size (1.0 = 26 px text at 1440p)
OVERLAY_SCALE=1.1

# Where banners appear
OVERLAY_POSITION=top-right

# Connect banner caption and accent colour (the logo's blue)
OVERLAY_ACCENT=#6fd0ff

# Banner text colour
OVERLAY_FG=#ffffff

# Banner box colour (solid style)
OVERLAY_BG=#161a22

# Banner text edge colour (outline style)
OVERLAY_OUTLINE=#000000


# ===== Hardware ====================================================

# Seconds between hardware samples (restart)
HW_INTERVAL=10

# Seconds between disk health checks (smartctl); 0 turns them off (restart)
SMART_INTERVAL=600

# Sources to turn off, comma-separated (e.g. smart,nvidia) (restart)
HW_SKIP=''


# ===== History =====================================================

# How long 10-second samples are kept
KEEP_RAW=24h

# How long 1-minute averages are kept
KEEP_MINUTE=7d

# How long 1-hour averages are kept
KEEP_HOUR=365d

# Where the history is stored (empty = the add-on's history folder) (restart)
HISTORY_DIR=''


# ===== Alerts ======================================================

# Show a banner for critical hardware problems
ALERTS=on

# Seconds an alert banner stays on screen
ALERT_DURATION=10

# Alert banner caption and accent colour
ALERT_ACCENT=#ef4444

# CPU temperature limit in °C; auto = the sensor's own limit, else 90; 0 turns
# it off
ALERT_CPU_TEMP=auto

# GPU temperature limit in °C; auto = the sensor's own limit, else 90; 0 turns
# it off
ALERT_GPU_TEMP=auto

# Disk temperature limit in °C; auto = the drive's own limit, else 70; 0 turns
# it off
ALERT_DISK_TEMP=auto

# Alert when a drive has less than this many GB free; 0 turns it off
ALERT_DISK_FREE_GB=5

# Or less than this percent free, whichever comes first; 0 turns it off
ALERT_DISK_FREE_PCT=2

# Alert when less than this percent of RAM is available; 0 turns it off
ALERT_RAM=5

# Alert when a device that isn't known connects to this box
ALERT_UNKNOWN=on

# Also alert when an unknown device tries a port nothing is listening on
# (scans; phones and TVs do it too)
ALERT_ATTEMPTS=off

# Known devices: named = the ones in aliases.conf and your Tailscale
# machines; seen = also every device in the history
KNOWN_DEVICES=named


# ===== Network =====================================================

# Seconds between connection scans (restart)
INTERVAL=2

# LAN IPs of subnet routers that auto-detection misses, comma-separated
# (restart)
SUBNET_ROUTER=''

# tailscaled's WireGuard port (hidden as Tailscale's own traffic) (restart)
WG_PORT=41641

# Show your router's own DNS/UPnP traffic (restart)
SHOW_GATEWAY=off

# Show Tailscale's own traffic (WireGuard, DERP, MagicDNS) (restart)
SHOW_TRANSPORT=off

# Only show connections made to this box (restart)
INBOUND_ONLY=off

# Sunshine's config file (for its ports) (restart)
SUNSHINE_CONF=/userdata/system/add-ons/sunshine/.config/sunshine/sunshine.conf

# tailscaled's socket (restart)
TS_SOCKET=/var/run/tailscale/tailscaled.sock


# ===== Banners =====================================================

# X display banners are drawn on (restart)
DISPLAY=:0


# ===== Logs ========================================================

# Where BatoWatch writes its log (restart)
LOG=/userdata/system/logs/batowatch.log

# Rotate the log at this size; 0 never rotates (restart)
LOG_MAX_BYTES=1048576

# Rotated logs to keep (at least 1) (restart)
LOG_KEEP=1

# The service's own small log (empty = batowatch-service.log next to LOG)
# (restart)
SERVICE_LOG=''
